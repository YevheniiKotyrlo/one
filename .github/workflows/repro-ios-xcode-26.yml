name: repro — iOS build with Xcode 26

on:
  push:
    branches: [repro/ios-27-sdk-guard]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: 'package.json'
      - name: Build repro/ for the iOS simulator
        env:
          REPRO_LOG: ${{ runner.temp }}/xcodebuild.log
        run: node repro/reproduce-ios.mjs
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild.log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
